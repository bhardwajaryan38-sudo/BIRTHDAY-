<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy Birthday Sakshi! ❤️</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Dancing+Script:wght@700&family=Great+Vibes&family=Montserrat:wght@400;600;800;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary-pink: #ff4d6d;
      --deep-pink: #c9184a;
      --soft-pink: #ffb3c1;
      --glow-pink: rgba(255, 77, 109, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background: #0d0614;
      color: #fff;
      text-align: center;
    }

    .page {
      display: none;
      min-height: 100vh;
      width: 100%;
      padding: 30px 16px 100px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .page.active {
      display: flex;
      animation: fadeIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Common Button Styling */
    .action-btn {
      background: linear-gradient(135deg, #ff3366, #ff758c);
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 14px 28px;
      border-radius: 50px;
      border: none;
      box-shadow: 0 10px 25px rgba(255, 51, 102, 0.45);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .action-btn:active { transform: scale(0.95); }

    /* Next Button Placed in Lowest Left Corner */
    .btn-lower-left {
      position: fixed;
      bottom: 25px;
      left: 20px;
      z-index: 1000;
      box-shadow: 0 8px 25px rgba(255, 77, 109, 0.6);
      animation: pulseBtn 1.8s infinite ease-in-out;
    }
    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* ===================================================
       STAGE 1: YELLOW SCRATCH CARD OVERLAY
       =================================================== */
    #scratch-container {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 9999;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    #scratch-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* ===================================================
       STAGE 2: PINK BIRTHDAY REVEAL
       =================================================== */
    #page-reveal {
      background: radial-gradient(circle at center, #ffe0e9 0%, #ffafcc 45%, #ff758c 100%);
      color: #4a0e17;
    }
    .pink-hero-card {
      background: rgba(255, 255, 255, 0.94);
      padding: 40px 22px;
      border-radius: 35px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(201, 24, 74, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.8);
      border: 3px solid #ffccd5;
      position: relative;
    }
    .hbd-banner-text {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      letter-spacing: 5px;
      color: #c9184a;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 1px 2px 4px rgba(201, 24, 74, 0.2);
    }
    .sakshi-script-name {
      font-family: 'Great Vibes', cursive;
      font-size: 5.2rem;
      color: #d90429;
      line-height: 1.1;
      margin: 10px 0 14px;
      text-shadow: 0 4px 15px rgba(217, 4, 41, 0.25);
      animation: heartGlow 2.5s infinite alternate;
    }
    @keyframes heartGlow {
      from { filter: drop-shadow(0 0 4px #ff758c); }
      to { filter: drop-shadow(0 0 16px #ff0055); }
    }
    .bday-date-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #c9184a, #ff4d6d);
      color: #fff;
      font-weight: 800;
      font-size: 1.3rem;
      padding: 10px 24px;
      border-radius: 50px;
      letter-spacing: 3px;
      box-shadow: 0 10px 20px rgba(201, 24, 74, 0.35);
      border: 2px solid #fff;
      margin-top: 10px;
    }

    /* ===================================================
       STAGE 3: SPIN WHEEL CHALLENGE
       =================================================== */
    #page-wheel {
      background: radial-gradient(circle at center, #1b0c2e 0%, #0a0312 100%);
    }
    .wheel-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #ff99c8;
      text-shadow: 0 0 20px #ff3366;
    }
    .wheel-wrapper {
      position: relative;
      margin: 25px auto 15px;
      width: 320px; height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wheel-pointer {
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 32px solid #ffd700;
      z-index: 10;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    }
    #wheel-canvas {
      width: 310px; height: 310px;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(255, 77, 109, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.4);
      border: 5px solid #ffd700;
      transition: transform 4.5s cubic-bezier(0.12, 0.8, 0.15, 1);
    }
    .spin-prompt-text {
      font-size: 1.05rem;
      color: #f7cad0;
      margin: 15px 0 18px;
      font-weight: 600;
    }

    /* Wheel All-in-One Pop-up Modal */
    .wheel-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .wheel-modal-box {
      background: linear-gradient(145deg, #2b0e3f, #150222);
      border: 2px solid #ff758c;
      border-radius: 25px;
      padding: 30px 22px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 45px rgba(255, 77, 109, 0.5);
      animation: popIn 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .wheel-modal-title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #ffd700;
      margin-bottom: 8px;
    }
    .wheel-list-items {
      text-align: left;
      margin: 18px 0 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .wheel-list-row {
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 12px;
      border-left: 4px solid #ff4d6d;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ===================================================
       STAGE 4: FROSTED GLASS & BACKLIGHT PHOTO GALLERY
       =================================================== */
    #page-gallery {
      background: linear-gradient(135deg, #090312 0%, #150a26 50%, #0d0417 100%);
      justify-content: flex-start;
      padding-top: 35px;
    }
    .gallery-heading {
      font-family: 'Dancing Script', cursive;
      font-size: 2.7rem;
      color: #ff99c8;
      margin-bottom: 5px;
    }
    .frosted-glass-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 460px;
      margin: 20px 0 30px;
    }
    .frosted-card {
      position: relative;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 9px 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s;
    }
    /* Vibrant Backlight Glow */
    .frosted-card::before {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      background: linear-gradient(135deg, #ff007f, #7928ca, #00d4ff);
      border-radius: 20px;
      z-index: -1;
      filter: blur(14px);
      opacity: 0.75;
      animation: ambientBacklight 3s ease infinite alternate;
    }
    @keyframes ambientBacklight {
      0% { opacity: 0.55; filter: blur(12px); }
      100% { opacity: 0.95; filter: blur(18px); }
    }
    .frosted-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      background: #2a1236;
    }
    .frosted-badge {
      position: absolute;
      top: 4px; left: 4px;
      background: linear-gradient(135deg, #ffd700, #ff8800);
      color: #000;
      font-weight: 800;
      font-size: 0.75rem;
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      border: 1.5px solid #fff;
    }
    .frosted-card-caption {
      font-size: 0.8rem;
      font-weight: 600;
      color: #f7cad0;
      margin-top: 8px;
    }

    /* ===================================================
       STAGE 5: 3D UNFOLDING LOVE LETTER
       =================================================== */
    #page-letter {
      background: radial-gradient(circle at center, #240a2c 0%, #0d0213 100%);
    }
    .envelope-box {
      width: 290px;
      height: 190px;
      background: #ffffff;
      border-radius: 14px;
      position: relative;
      cursor: pointer;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #ffccd5;
      transition: transform 0.3s;
    }
    .envelope-box:active { transform: scale(0.97); }
    .beating-red-heart {
      font-size: 4.8rem;
      color: #e63946;
      animation: heartbeat 1.1s infinite;
      filter: drop-shadow(0 0 15px rgba(230, 57, 70, 0.7));
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      14% { transform: scale(1.25); }
      28% { transform: scale(1); }
      42% { transform: scale(1.2); }
      70% { transform: scale(1); }
    }
    .letter-prompt {
      font-size: 1.1rem;
      color: #ffccd5;
      font-weight: 600;
      margin-top: 22px;
      animation: pulseBtn 1.5s infinite;
    }

    /* Unfolded Letter Overlay */
    .letter-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 2500;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .unfolded-parchment {
      background: #fffdf7;
      color: #2b1117;
      max-width: 440px;
      width: 100%;
      border-radius: 20px;
      padding: 30px 22px 25px;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
      border: 2px solid #f9bec7;
      text-align: left;
      transform-origin: top center;
      animation: unfoldAnim 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes unfoldAnim {
      from { transform: scaleY(0.1) rotateX(-90deg); opacity: 0; }
      to { transform: scaleY(1) rotateX(0deg); opacity: 1; }
    }
    .corner-heart { position: absolute; font-size: 1.5rem; }
    .ch-tl { top: 10px; left: 12px; }
    .ch-tr { top: 10px; right: 12px; }
    .ch-bl { bottom: 10px; left: 12px; }
    .ch-br { bottom: 10px; right: 12px; }
    .letter-body-text {
      font-size: 0.94rem;
      line-height: 1.85;
      font-weight: 500;
      color: #3d1c24;
      white-space: pre-line;
      padding: 10px 5px;
    }

    /* ===================================================
       STAGE 6: EMOTIONAL CELEBRATION BRIDGE
       =================================================== */
    #page-bridge {
      background: radial-gradient(circle at center, #2e083d 0%, #100119 100%);
      padding: 30px 24px;
    }
    .bridge-quote-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      border-radius: 30px;
      padding: 40px 24px;
      max-width: 420px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
    }
    .bridge-bold-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.7;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 30px;
      text-shadow: 0 2px 10px rgba(255, 77, 109, 0.5);
    }

    /* ===================================================
       STAGE 7: 3D BLACK FOREST CAKE & DRAGGABLE KNIFE
       =================================================== */
    #page-cake {
      background: radial-gradient(circle at center, #2b0833 0%, #0c0012 100%);
      overflow: hidden;
      touch-action: none;
    }
    .cake-arena {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
    }

    /* 3D Black Forest Cake */
    .black-forest-cake {
      position: relative;
      width: 230px;
      height: 150px;
      cursor: pointer;
      transition: filter 0.4s;
    }
    .cake-half-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .cake-left-half, .cake-right-half {
      width: 50%;
      height: 100%;
      position: relative;
      overflow: visible;
      transition: transform 0.8s ease;
    }
    .cake-cylinder {
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #2b1713 0%, #150b09 70%, #0d0605 100%);
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      border-top: 8px solid #fefae0; /* Vanilla Cream Layer */
      position: relative;
    }
    .cake-left-half .cake-cylinder { border-radius: 25px 0 0 20px; border-right: 2px dashed rgba(255,255,255,0.15); }
    .cake-right-half .cake-cylinder { border-radius: 0 25px 20px 0; border-left: 2px dashed rgba(255,255,255,0.15); }

    /* Cherries & Flowers on Cake */
    .cake-decor-item { position: absolute; font-size: 1.3rem; z-index: 5; }
    .fl-1 { top: -14px; left: 18px; }
    .fl-2 { top: -12px; left: 55px; }
    .fl-3 { top: -14px; right: 55px; }
    .fl-4 { top: -12px; right: 18px; }
    .ch-center { top: -18px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; }

    /* Candle */
    .cake-candle-stick {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 38px;
      background: repeating-linear-gradient(45deg, #ff758c, #ff758c 6px, #ffffff 6px, #ffffff 12px);
      border-radius: 4px;
      z-index: 10;
    }
    .candle-flame-glow {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 20px;
      background: #ffbe0b;
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 15px 6px #fb5607;
      animation: flicker 0.6s infinite alternate;
    }
    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.15) rotate(3deg); }
    }

    /* Cut States */
    .cake-sliced .cake-left-half { transform: translateX(-40px) rotate(-6deg); }
    .cake-sliced .cake-right-half { transform: translateX(40px) rotate(6deg); }
    .cake-sliced .candle-flame-glow { display: none; }

    /* Movable Knife */
    #knife-draggable {
      position: fixed;
      bottom: 25px;
      left: 20px;
      z-index: 999;
      cursor: grab;
      touch-action: none;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 50px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .knife-icon {
      font-size: 2.4rem;
      transform: rotate(-45deg);
      display: inline-block;
      animation: swingKnife 1.5s infinite ease-in-out;
    }
    @keyframes swingKnife {
      0%, 100% { transform: rotate(-45deg); }
      50% { transform: rotate(-25deg) scale(1.1); }
    }
    .knife-hint-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    /* Flying Rocket */
    #flying-rocket {
      display: none;
      position: absolute;
      font-size: 3rem;
      z-index: 100;
      pointer-events: none;
    }

    /* ===================================================
       STAGE 8: FINAL CLIMAX MESSAGE
       =================================================== */
    #page-final {
      background: radial-gradient(circle at center, #350847 0%, #12011a 100%);
      padding: 40px 20px;
    }
    .final-love-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 45px 24px;
      max-width: 440px;
      border: 2px solid rgba(255, 117, 140, 0.4);
      box-shadow: 0 0 50px rgba(255, 77, 109, 0.35);
    }
    .final-sakshi-quote {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2rem;
      line-height: 1.6;
      color: #ffccd5;
      text-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
      font-weight: 700;
    }
    .final-heart-big {
      font-size: 4rem;
      color: #ff3366;
      margin-top: 20px;
      display: inline-block;
      animation: heartbeat 1.3s infinite;
    }

    /* Canvas for Falling Petals */
    #petal-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 800;
    }
  </style>
</head>
<body>

  <!-- Floating Falling Canvas -->
  <canvas id="petal-canvas"></canvas>

  <!-- ==========================================
       STAGE 1: YELLOW SCRATCH CARD OVERLAY
       ========================================== -->
  <div id="scratch-container">
    <canvas id="scratch-canvas"></canvas>
  </div>

  <!-- ==========================================
       STAGE 2: PINK BIRTHDAY REVEAL
       ========================================== -->
  <section class="page active" id="page-reveal">
    <div class="pink-hero-card">
      <div class="hbd-banner-text">HAPPY BIRTHDAY</div>
      <h1 class="sakshi-script-name">Sakshi</h1>
      <div>
        <div class="bday-date-badge">
          <span>🎂</span> 25 : 09 : 2004 <span>✨</span>
        </div>
      </div>
      <p style="font-size: 1.1rem; color: #7209b7; margin-top: 18px; font-weight: 600; font-family: 'Dancing Script', cursive;">
        Happiest Birthday To My Entire Universe ❤️
      </p>
    </div>
    <!-- Lowest Left Corner Next Button -->
    <button class="action-btn btn-lower-left" onclick="goToPage('page-wheel')">
      Next ➔
    </button>
  </section>

  <!-- ==========================================
       STAGE 3: SPIN WHEEL CHALLENGE
       ========================================== -->
  <section class="page" id="page-wheel">
    <h2 class="wheel-title">What Suits You Best? 🎡</h2>
    <div class="wheel-wrapper">
      <div class="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="310" height="310"></canvas>
    </div>
    <p class="spin-prompt-text">
